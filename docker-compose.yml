# Kafka local para desarrollo: un único nodo en modo KRaft (sin Zookeeper).
#
#   docker compose up -d       arrancar
#   docker compose logs kafka  ver qué pasa
#   docker compose down        parar
#
# Para que otros PCs del laboratorio se conecten, arrancar indicando la IP
# de este equipo:  KAFKA_HOST=192.168.1.20 docker compose up -d
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: wm-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # Este único nodo hace de broker (guarda mensajes) y de controlador (metadatos).
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: contenedores de la red de Docker. EXTERNAL: programas fuera de Docker.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      # Dirección que Kafka comunica a los clientes para que vuelvan a conectarse.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      # Con un solo nodo no se puede replicar más de una vez.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
