# Comunicaciones locales: CENTRAL, Monitor de prueba y Kafka en modo KRaft.
#
#   docker compose up -d kafka arrancar solo el broker
#   docker compose logs kafka  ver qué pasa
#   docker compose down        parar
#
# Para que otros PCs del laboratorio se conecten, arrancar indicando la IP
# de este equipo:  KAFKA_HOST=192.168.1.20 docker compose up -d kafka
#
# En AWS se usa deploy/arrancar_aws.sh, que pone la IP pública automáticamente
# (guía completa en docs/DESPLIEGUE_AWS.md).
services:
  central:
    build: .
    # En AWS, WM_CENTRAL_IMAGE (fichero .env) apunta a la imagen de Docker Hub
    # que publica GitHub Actions; en local se construye con el nombre por defecto.
    image: ${WM_CENTRAL_IMAGE:-wm-central:local}
    ports:
      - "${WM_SOCKET_PUBLISHED_PORT:-9999}:${WM_SOCKET_PORT:-9999}"
      - "${WM_HTTP_PUBLISHED_PORT:-8080}:8080"  # panel web
    depends_on: [kafka]
    environment:
      WM_SOCKET_PORT: ${WM_SOCKET_PORT:-9999}
      WM_SOCKET_TIMEOUT: ${WM_CENTRAL_TIMEOUT:-6}
      WM_DB_PATH: /app/data/wm.db
      # Dentro de la red de Docker, Kafka se alcanza por su listener INTERNAL.
      WM_KAFKA_SERVER: ${WM_KAFKA_SERVER:-kafka:29092}
    volumes:
      - wm-datos:/app/data
    stop_grace_period: 10s
    # Vuelve a arrancar sola si se cae o si se reinicia la máquina (AWS).
    restart: unless-stopped

  # Prueba opcional del enlace TCP: docker compose --profile demo up --build central monitor
  monitor:
    profiles: [demo]
    build: .
    command: ["python", "WM_WS_M.py"]
    depends_on: [central]
    environment:
      WM_CENTRAL_HOST: central
      WM_CENTRAL_PORT: ${WM_SOCKET_PORT:-9999}
      WM_WS_ID: ${WM_WS_ID:-WS-04}
      WM_WS_LOCATION: ${WM_WS_LOCATION:-River Park}
      WM_SOCKET_TIMEOUT: ${WM_MONITOR_TIMEOUT:-3}
      WM_PING_INTERVAL: ${WM_PING_INTERVAL:-2}
      WM_RECONNECT_DELAY: ${WM_RECONNECT_DELAY:-2}
    stop_grace_period: 10s

  kafka:
    image: apache/kafka:3.9.1
    container_name: wm-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # Memoria de Java acotada para que quepa en una instancia pequeña (2 GB).
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms512m}
      KAFKA_NODE_ID: 1
      # Este único nodo hace de broker (guarda mensajes) y de controlador (metadatos).
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: contenedores de la red de Docker. EXTERNAL: programas fuera de Docker.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      # Dirección que Kafka comunica a los clientes para que vuelvan a conectarse.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      # Con un solo nodo no se puede replicar más de una vez.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  wm-datos:
